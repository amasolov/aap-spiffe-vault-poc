---
# Demo: SPIFFE/Vault per-job credential isolation
#
# This playbook demonstrates that each AAP job can only access secrets
# for its own organization. The EE pod's SPIFFE identity determines
# which Vault role it can authenticate to, and each role is scoped
# to a single Vault path.
#
# Run via AAP Job Template assigned to a per-org Container Group.
# The Container Group's pod spec includes the org label that SPIRE
# uses to issue the correct SPIFFE identity.
#
# Expected results:
#   - Fetching own-org secrets: succeeds
#   - Fetching cross-org secrets: fails with permission denied
#
# Variables (set via Job Template extra_vars or survey):
#   org_name:    Organization slug (e.g. infra-corp, appdev-squad)
#   vault_role:  Vault JWT role for this org (e.g. aap-org-infra-corp)
#   vault_path:  Vault KV v2 path for this org's secrets

- name: SPIFFE/Vault Credential Isolation Demo
  hosts: localhost
  gather_facts: false
  vars:
    org_name: "{{ org_name | default('infra-corp') }}"
    vault_role: "aap-org-{{ org_name }}"
    vault_path: "secret/data/aap/org/{{ org_name }}/creds"
    cross_org: "{{ cross_org_name | default('appdev-squad') }}"

  tasks:
    - name: Verify SPIFFE JWT-SVID is available
      ansible.builtin.stat:
        path: /svids/jwt.token
      register: jwt_stat

    - name: Assert JWT-SVID exists
      ansible.builtin.assert:
        that: jwt_stat.stat.exists
        fail_msg: >-
          JWT-SVID not found at /svids/jwt.token.
          Ensure the Container Group pod spec includes the
          spiffe-helper init container and svids volume.
        success_msg: "JWT-SVID present ({{ jwt_stat.stat.size }} bytes)"

    # --- Own-org access: should succeed ---
    - name: "Fetch {{ org_name }} secrets from Vault"
      ansible.builtin.set_fact:
        org_secrets: >-
          {{ lookup('spiffe_vault', vault_path,
             vault_role=vault_role,
             field='api_key') }}

    - name: "Verify {{ org_name }} secret retrieval"
      ansible.builtin.debug:
        msg: "Retrieved api_key for {{ org_name }} ({{ org_secrets | length }} chars)"

    # --- Cross-org access: should fail ---
    - name: "Attempt cross-org access to {{ cross_org }} secrets"
      ansible.builtin.set_fact:
        stolen_secret: >-
          {{ lookup('spiffe_vault',
             'secret/data/aap/org/' + cross_org + '/creds',
             vault_role='aap-org-' + cross_org,
             field='api_key') }}
      ignore_errors: true
      register: cross_org_result

    - name: Verify cross-org access was denied
      ansible.builtin.assert:
        that: cross_org_result is failed
        fail_msg: >-
          SECURITY VIOLATION: Cross-org access to {{ cross_org }}
          succeeded! The SPIFFE identity {{ org_name }} should not
          be able to authenticate to the {{ cross_org }} Vault role.
        success_msg: >-
          Isolation confirmed: {{ org_name }} cannot access
          {{ cross_org }}'s secrets.

    # --- Summary ---
    - name: Isolation demo results
      ansible.builtin.debug:
        msg: |
          SPIFFE/Vault Credential Isolation Demo Results
          ===============================================
          Organization:     {{ org_name }}
          SPIFFE identity:  (from JWT-SVID at /svids/jwt.token)
          Vault role:       {{ vault_role }}
          Own-org access:   ALLOWED ({{ org_secrets | length }} char secret)
          Cross-org access: DENIED ({{ cross_org }})

          The EE pod's SPIFFE identity is cryptographically scoped
          to this organization. Even running inside the same AAP
          instance, on the same cluster, in the same namespace,
          this job cannot read another org's secrets.
