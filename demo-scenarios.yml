---
# AAP SPIFFE/Vault POC - Demo Scenarios
#
# Three progressive demonstrations of org-tree secret scoping:
#   1. Identity chain: SPIRE -> JWT -> Vault -> secret (prove the infra works)
#   2. Org isolation: cross-org denial (prove the RBAC works)
#   3. Full tree: what project/JT/playbook scoping looks like (target architecture)
#
# Usage:
#   ansible-playbook demo-scenarios.yml --tags scenario1     # Identity chain
#   ansible-playbook demo-scenarios.yml --tags scenario2     # Org isolation
#   ansible-playbook demo-scenarios.yml --tags scenario3     # Full tree vision
#   ansible-playbook demo-scenarios.yml                      # All three

- name: "Demo Setup: Create test script ConfigMaps"
  hosts: localhost
  gather_facts: false
  connection: local
  tags: [always]
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Create chain-demo script ConfigMap
      ansible.builtin.shell:
        cmd: |
          cat << 'PYEOF' | oc -n {{ aap_namespace }} create configmap demo-chain-script --from-file=test.py=/dev/stdin --dry-run=client -o yaml | oc apply -f -
          import json, os, ssl, sys, base64
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          VAULT_URL = os.environ["VAULT_URL"]
          VAULT_ROLE = os.environ.get("VAULT_ROLE", "aap-org-infra-corp")
          VAULT_PATH = os.environ.get("VAULT_PATH", "secret/data/aap/org/infra-corp/credentials")

          with open("/svids/jwt.token") as f:
              jwt = f.read().strip()

          claims = json.loads(base64.urlsafe_b64decode(jwt.split(".")[1] + "==="))
          print("=== SPIFFE Identity ===")
          print(f"  Subject: {claims.get('sub')}")
          print(f"  Audience: {claims.get('aud')}")
          print(f"  Expires:  {claims.get('exp')}")

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          data = json.dumps({"role": VAULT_ROLE, "jwt": jwt}).encode()
          req = Request(f"{VAULT_URL}/v1/auth/jwt/login", data=data, method="POST")
          req.add_header("Content-Type", "application/json")
          resp = urlopen(req, context=ctx, timeout=10)
          auth = json.loads(resp.read())["auth"]
          print(f"\n=== Vault Auth ===")
          print(f"  Policies: {auth['token_policies']}")
          print(f"  TTL: {auth['lease_duration']}s")

          req2 = Request(f"{VAULT_URL}/v1/{VAULT_PATH}")
          req2.add_header("X-Vault-Token", auth["client_token"])
          resp2 = urlopen(req2, context=ctx, timeout=10)
          secret = json.loads(resp2.read())["data"]["data"]
          print(f"\n=== Secrets Retrieved ===")
          for k in secret:
              print(f"  {k}: ****")
          print(f"\nChain complete: pod label -> SPIRE -> JWT -> Vault -> secret")
          PYEOF
        executable: /bin/bash
      changed_when: false

    - name: Create cross-org-demo script ConfigMap
      ansible.builtin.shell:
        cmd: |
          cat << 'PYEOF' | oc -n {{ aap_namespace }} create configmap demo-crossorg-script --from-file=test.py=/dev/stdin --dry-run=client -o yaml | oc apply -f -
          import json, os, ssl, base64
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          VAULT_URL = os.environ["VAULT_URL"]
          VAULT_ROLE = os.environ.get("VAULT_ROLE", "aap-org-infra-corp")
          OWN_ORG = os.environ.get("OWN_ORG", "infra-corp")
          OTHER_ORGS = os.environ.get("OTHER_ORGS", "secops-team,appdev-squad,platform-ops").split(",")

          with open("/svids/jwt.token") as f:
              jwt = f.read().strip()

          claims = json.loads(base64.urlsafe_b64decode(jwt.split(".")[1] + "==="))
          print(f"Identity: {claims.get('sub')}")

          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          data = json.dumps({"role": VAULT_ROLE, "jwt": jwt}).encode()
          req = Request(f"{VAULT_URL}/v1/auth/jwt/login", data=data, method="POST")
          req.add_header("Content-Type", "application/json")
          auth = json.loads(urlopen(req, context=ctx, timeout=10).read())["auth"]
          token = auth["client_token"]
          print(f"Policies: {auth['token_policies']}")

          print(f"\n=== Own org ({OWN_ORG}): should succeed ===")
          req2 = Request(f"{VAULT_URL}/v1/secret/data/aap/org/{OWN_ORG}/credentials")
          req2.add_header("X-Vault-Token", token)
          secret = json.loads(urlopen(req2, context=ctx, timeout=10).read())["data"]["data"]
          print(f"  Keys: {list(secret.keys())} -> SUCCESS")

          for other_org in OTHER_ORGS:
              print(f"\n=== Cross-org ({other_org}): should be denied ===")
              try:
                  req3 = Request(f"{VAULT_URL}/v1/secret/data/aap/org/{other_org}/credentials")
                  req3.add_header("X-Vault-Token", token)
                  urlopen(req3, context=ctx, timeout=10)
                  print(f"  FAIL: {other_org} secrets were accessible!")
              except HTTPError as e:
                  print(f"  HTTP {e.code} -> DENIED (correct)")
          PYEOF
        executable: /bin/bash
      changed_when: false

# ============================================================
# Scenario 1: SPIFFE Identity Chain
# Prove: pod label -> SPIRE attestation -> JWT-SVID -> Vault auth -> secret
# ============================================================
- name: "Scenario 1: SPIFFE Identity Chain"
  hosts: localhost
  gather_facts: false
  connection: local
  tags: [scenario1]
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: "DEMO: SPIFFE identity chain"
      ansible.builtin.pause:
        prompt: |
          ╔══════════════════════════════════════════════════════════════╗
          ║  SCENARIO 1: SPIFFE Identity Chain                         ║
          ╠══════════════════════════════════════════════════════════════╣
          ║                                                            ║
          ║  Proving the end-to-end trust chain:                       ║
          ║                                                            ║
          ║  1. Pod with org label is created                          ║
          ║  2. SPIRE Agent attests the pod via kubelet                ║
          ║  3. spiffe-helper fetches a JWT-SVID (5 min TTL)          ║
          ║  4. JWT is exchanged for a scoped Vault token              ║
          ║  5. Vault token reads only the org's secrets               ║
          ║                                                            ║
          ║  No static credentials. No manual configuration.           ║
          ║  Identity is cryptographic, attested by the platform.      ║
          ║                                                            ║
          ╚══════════════════════════════════════════════════════════════╝
          Press ENTER to begin...

    - name: Get SPIRE Server pod
      ansible.builtin.command:
        cmd: "oc -n {{ spire_namespace }} get pods -l app=spire-server --no-headers -o custom-columns=NAME:.metadata.name"
      register: __spire_pod
      changed_when: false

    - name: Get Vault pod
      ansible.builtin.command:
        cmd: "oc -n {{ vault_namespace }} get pods -l app=vault --no-headers -o custom-columns=NAME:.metadata.name"
      register: __vault_pod
      changed_when: false

    - name: "STEP 1: Show registered SPIFFE identities"
      ansible.builtin.shell:
        cmd: >-
          oc exec -n {{ spire_namespace }} {{ __spire_pod.stdout_lines[0] }} -c spire-server --
          /opt/spire/bin/spire-server entry show -socketPath /run/spire/data/api.sock 2>/dev/null |
          grep -E 'SPIFFE ID|Selector' | head -20
        executable: /bin/bash
      register: __entries
      changed_when: false

    - name: Display SPIFFE entries
      ansible.builtin.debug:
        msg: "{{ __entries.stdout_lines }}"

    - name: Get Vault root token
      ansible.builtin.shell:
        cmd: >-
          oc get secret -n {{ vault_namespace }} vault-init-credentials
          -o jsonpath='{.data.root_token}' | base64 -d
        executable: /bin/bash
      register: __vault_token
      changed_when: false
      no_log: true

    - name: "STEP 2: Show Vault JWT auth configuration"
      ansible.builtin.shell:
        cmd: |
          VT="{{ __vault_token.stdout }}"
          echo "=== OIDC Discovery URL ==="
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} -- \
            sh -c "VAULT_TOKEN=$VT vault read -field=oidc_discovery_url auth/jwt/config" 2>/dev/null || echo "(unavailable)"
          echo ""
          echo "=== Vault roles (bound to SPIFFE IDs) ==="
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} -- \
            sh -c "VAULT_TOKEN=$VT vault list auth/jwt/role" 2>/dev/null || echo "(unavailable)"
        executable: /bin/bash
      register: __vault_config
      changed_when: false
      no_log: true

    - name: Display Vault config
      ansible.builtin.debug:
        msg: "{{ __vault_config.stdout_lines }}"

    - name: "STEP 3a: Delete stale demo pod (if any)"
      ansible.builtin.command:
        cmd: "oc delete pod spiffe-chain-demo -n {{ aap_namespace }} --ignore-not-found"
      changed_when: false

    - name: "STEP 3b: Create test pod"
      ansible.builtin.shell:
        cmd: |
          cat << 'EOF' | oc apply -n {{ aap_namespace }} -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: spiffe-chain-demo
            labels:
              spiffe.io/spiffe-id: org-infra-corp
          spec:
            restartPolicy: Never
            initContainers:
            - name: fetch-jwt
              image: {{ spire_helper_image }}
              args: ["-config", "/run/spire/config/helper.conf", "-daemon-mode=false"]
              securityContext:
                seLinuxOptions:
                  type: spc_t
              volumeMounts:
              - name: spire-socket
                mountPath: /run/spire/sockets
                readOnly: true
              - name: svids
                mountPath: /svids
              - name: helper-config
                mountPath: /run/spire/config
                readOnly: true
            containers:
            - name: demo
              image: registry.access.redhat.com/ubi9/python-311:latest
              command: ["python3", "/scripts/test.py"]
              env:
              - name: VAULT_URL
                value: "http://vault.{{ vault_namespace }}.svc.cluster.local:8200"
              - name: VAULT_ROLE
                value: "aap-org-infra-corp"
              - name: VAULT_PATH
                value: "secret/data/aap/org/infra-corp/credentials"
              securityContext:
                runAsUser: 0
                seLinuxOptions:
                  type: spc_t
              volumeMounts:
              - name: svids
                mountPath: /svids
              - name: script
                mountPath: /scripts
                readOnly: true
            volumes:
            - name: spire-socket
              csi:
                driver: csi.spiffe.io
                readOnly: true
            - name: svids
              emptyDir: {}
            - name: helper-config
              configMap:
                name: spiffe-helper-config
            - name: script
              configMap:
                name: demo-chain-script
          EOF
        executable: /bin/bash
      changed_when: false

    - name: "STEP 3c: Wait for pod to complete (up to 90s)"
      ansible.builtin.shell:
        cmd: >-
          oc wait pod/spiffe-chain-demo -n {{ aap_namespace }}
          --for=jsonpath='{.status.phase}'=Succeeded --timeout=90s 2>&1 ||
          oc wait pod/spiffe-chain-demo -n {{ aap_namespace }}
          --for=jsonpath='{.status.phase}'=Failed --timeout=30s 2>&1
        executable: /bin/bash
      register: __wait
      changed_when: false
      failed_when: false

    - name: "STEP 3d: Show pod logs"
      ansible.builtin.command:
        cmd: "oc logs spiffe-chain-demo -n {{ aap_namespace }} -c demo"
      register: __chain_output
      changed_when: false
      failed_when: false

    - name: Display chain result
      ansible.builtin.debug:
        msg: "{{ __chain_output.stdout_lines | default(['(no output)']) }}"

    - name: "STEP 3e: Cleanup demo pod"
      ansible.builtin.command:
        cmd: "oc delete pod spiffe-chain-demo -n {{ aap_namespace }} --ignore-not-found"
      changed_when: false

# ============================================================
# Scenario 2: Org-Level Isolation + Cross-Org Denial
# Prove: org A reads its secrets, org A CANNOT read org B's secrets
# ============================================================
- name: "Scenario 2: Org-Level Isolation"
  hosts: localhost
  gather_facts: false
  connection: local
  tags: [scenario2]
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: "DEMO: Org-level isolation"
      ansible.builtin.pause:
        prompt: |
          ╔══════════════════════════════════════════════════════════════╗
          ║  SCENARIO 2: Org-Level Isolation + Cross-Org Denial        ║
          ╠══════════════════════════════════════════════════════════════╣
          ║                                                            ║
          ║  4 organizations, each with its own Vault path:            ║
          ║    Infra-Corp     -> secret/aap/org/infra-corp/*           ║
          ║    AppDev-Squad   -> secret/aap/org/appdev-squad/*         ║
          ║    SecOps-Team    -> secret/aap/org/secops-team/*          ║
          ║    Platform-Ops   -> secret/aap/org/platform-ops/*         ║
          ║                                                            ║
          ║  Test: Infra-Corp reads its own secrets, then tries        ║
          ║  to read all other orgs' secrets. Should get HTTP 403.     ║
          ║                                                            ║
          ╚══════════════════════════════════════════════════════════════╝
          Press ENTER to begin...

    - name: Get Vault pod
      ansible.builtin.command:
        cmd: "oc -n {{ vault_namespace }} get pods -l app=vault --no-headers -o custom-columns=NAME:.metadata.name"
      register: __vault_pod
      changed_when: false

    - name: Get Vault root token
      ansible.builtin.shell:
        cmd: >-
          oc get secret -n {{ vault_namespace }} vault-init-credentials
          -o jsonpath='{.data.root_token}' | base64 -d
        executable: /bin/bash
      register: __vault_token
      changed_when: false
      no_log: true

    - name: "STEP 1: Show Vault policies (org-scoped)"
      ansible.builtin.shell:
        cmd: |
          VT="{{ __vault_token.stdout }}"
          for org in infra-corp appdev-squad secops-team platform-ops; do
            echo "=== Policy: aap-org-${org}-secret ==="
            oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} -- \
              sh -c "VAULT_TOKEN=$VT vault policy read aap-org-${org}-secret" 2>/dev/null || echo "(unavailable)"
            echo ""
          done
        executable: /bin/bash
      register: __policies
      changed_when: false
      no_log: true

    - name: Display policies
      ansible.builtin.debug:
        msg: "{{ __policies.stdout_lines }}"

    - name: "STEP 2a: Delete stale demo pod (if any)"
      ansible.builtin.command:
        cmd: "oc delete pod cross-org-demo -n {{ aap_namespace }} --ignore-not-found"
      changed_when: false

    - name: "STEP 2b: Create cross-org test pod"
      ansible.builtin.shell:
        cmd: |
          cat << 'EOF' | oc apply -n {{ aap_namespace }} -f -
          apiVersion: v1
          kind: Pod
          metadata:
            name: cross-org-demo
            labels:
              spiffe.io/spiffe-id: org-infra-corp
          spec:
            restartPolicy: Never
            initContainers:
            - name: fetch-jwt
              image: {{ spire_helper_image }}
              args: ["-config", "/run/spire/config/helper.conf", "-daemon-mode=false"]
              securityContext:
                seLinuxOptions:
                  type: spc_t
              volumeMounts:
              - name: spire-socket
                mountPath: /run/spire/sockets
                readOnly: true
              - name: svids
                mountPath: /svids
              - name: helper-config
                mountPath: /run/spire/config
                readOnly: true
            containers:
            - name: demo
              image: registry.access.redhat.com/ubi9/python-311:latest
              command: ["python3", "/scripts/test.py"]
              env:
              - name: VAULT_URL
                value: "http://vault.{{ vault_namespace }}.svc.cluster.local:8200"
              - name: VAULT_ROLE
                value: "aap-org-infra-corp"
              - name: OWN_ORG
                value: "infra-corp"
              - name: OTHER_ORGS
                value: "secops-team,appdev-squad,platform-ops"
              securityContext:
                runAsUser: 0
                seLinuxOptions:
                  type: spc_t
              volumeMounts:
              - name: svids
                mountPath: /svids
              - name: script
                mountPath: /scripts
                readOnly: true
            volumes:
            - name: spire-socket
              csi:
                driver: csi.spiffe.io
                readOnly: true
            - name: svids
              emptyDir: {}
            - name: helper-config
              configMap:
                name: spiffe-helper-config
            - name: script
              configMap:
                name: demo-crossorg-script
          EOF
        executable: /bin/bash
      changed_when: false

    - name: "STEP 2c: Wait for pod to complete (up to 90s)"
      ansible.builtin.shell:
        cmd: >-
          oc wait pod/cross-org-demo -n {{ aap_namespace }}
          --for=jsonpath='{.status.phase}'=Succeeded --timeout=90s 2>&1 ||
          oc wait pod/cross-org-demo -n {{ aap_namespace }}
          --for=jsonpath='{.status.phase}'=Failed --timeout=30s 2>&1
        executable: /bin/bash
      register: __wait
      changed_when: false
      failed_when: false

    - name: "STEP 2d: Show pod logs"
      ansible.builtin.command:
        cmd: "oc logs cross-org-demo -n {{ aap_namespace }} -c demo"
      register: __isolation_output
      changed_when: false
      failed_when: false

    - name: Display isolation result
      ansible.builtin.debug:
        msg: "{{ __isolation_output.stdout_lines | default(['(no output)']) }}"

    - name: "STEP 2e: Cleanup demo pod"
      ansible.builtin.command:
        cmd: "oc delete pod cross-org-demo -n {{ aap_namespace }} --ignore-not-found"
      changed_when: false

# ============================================================
# Scenario 3: Full Org-Tree Scoping (Target Architecture)
# Show: what project/JT/playbook scoping looks like with proposed labels
# ============================================================
- name: "Scenario 3: Full Org-Tree Scoping (Target)"
  hosts: localhost
  gather_facts: false
  connection: local
  tags: [scenario3]
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: "DEMO: Full org-tree scoping"
      ansible.builtin.pause:
        prompt: |
          ╔══════════════════════════════════════════════════════════════╗
          ║  SCENARIO 3: Full Org-Tree Scoping (Target Architecture)   ║
          ╠══════════════════════════════════════════════════════════════╣
          ║                                                            ║
          ║  Today:  org-level isolation (4 orgs demonstrated)         ║
          ║                                                            ║
          ║  Target: org / project / JT / playbook                     ║
          ║                                                            ║
          ║  Requires: AWX pod labels (Gap 1 in Open Questions)        ║
          ║  The architecture, SPIRE, Vault, and sidecars are the      ║
          ║  same. Only the pod labels and entry granularity change.    ║
          ║                                                            ║
          ╚══════════════════════════════════════════════════════════════╝
          Press ENTER to see the target design...

    - name: "TARGET: Pod labels AWX would set"
      ansible.builtin.debug:
        msg: |
          AWX would add 4 labels to every EE pod (Gap 1):

            aap.ansible.com/organization: infra-corp
            aap.ansible.com/project: cloud-infra
            aap.ansible.com/job-template: deploy-prod
            aap.ansible.com/playbook: site.yml

    - name: "TARGET: SPIRE entries at each tree level"
      ansible.builtin.debug:
        msg: |
          SPIRE entries for progressively deeper scoping:

          ORG LEVEL (current):
            SPIFFE ID:  spiffe://{{ spire_trust_domain }}/ns/{{ aap_namespace }}/org/infra-corp
            Selectors:  k8s:ns:{{ aap_namespace }}, k8s:pod-label:aap.ansible.com/organization:infra-corp
            Vault path: secret/data/aap/org/infra-corp/*

          PROJECT LEVEL:
            SPIFFE ID:  spiffe://{{ spire_trust_domain }}/ns/{{ aap_namespace }}/org/infra-corp/project/cloud-infra
            Selectors:  k8s:ns:{{ aap_namespace }}, k8s:pod-label:aap.ansible.com/organization:infra-corp,
                        k8s:pod-label:aap.ansible.com/project:cloud-infra
            Vault path: secret/data/aap/org/infra-corp/project/cloud-infra/*

          JOB TEMPLATE LEVEL:
            SPIFFE ID:  spiffe://{{ spire_trust_domain }}/ns/{{ aap_namespace }}/org/infra-corp/project/cloud-infra/jt/deploy-prod
            Selectors:  + k8s:pod-label:aap.ansible.com/job-template:deploy-prod
            Vault path: secret/data/aap/org/infra-corp/project/cloud-infra/jt/deploy-prod/*

          PLAYBOOK LEVEL:
            SPIFFE ID:  spiffe://{{ spire_trust_domain }}/ns/{{ aap_namespace }}/org/infra-corp/project/cloud-infra/jt/deploy-prod/playbook/site.yml
            Selectors:  + k8s:pod-label:aap.ansible.com/playbook:site.yml
            Vault path: secret/data/aap/org/infra-corp/project/cloud-infra/jt/deploy-prod/playbook/site.yml/*

    - name: "TARGET: Vault policy for playbook-level scoping"
      ansible.builtin.debug:
        msg: |
          Vault policy (aap-infra-corp-cloud-infra-deploy-prod-site):

            path "secret/data/aap/org/infra-corp/project/cloud-infra/jt/deploy-prod/playbook/site.yml/*" {
              capabilities = ["read"]
            }

          Vault role:
            bound_subject = "spiffe://{{ spire_trust_domain }}/ns/{{ aap_namespace }}/org/infra-corp/project/cloud-infra/jt/deploy-prod/playbook/site.yml"

          Or with OIDC JWT (Gap 3):
            bound_claims = {
              "aap_controller_organization_name": "infra-corp",
              "aap_controller_project_name": "cloud-infra",
              "aap_controller_job_template_name": "deploy-prod",
              "aap_controller_playbook_name": "site.yml"
            }

    - name: "SUMMARY"
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════
           POC Demo Complete
          ════════════════════════════════════════════════════════

          Scenario 1: Identity chain works end-to-end
            pod label -> SPIRE -> JWT-SVID -> Vault -> secret

          Scenario 2: Org-level isolation proven
            Own org: SUCCESS | Cross-org: HTTP 403

          Scenario 3: Full tree is the same architecture
            Only missing piece: AWX pod labels (Gap 1)
            The infra (SPIRE, Vault, sidecars) does not change.

# ============================================================
# Cleanup
# ============================================================
- name: "Demo Cleanup"
  hosts: localhost
  gather_facts: false
  connection: local
  tags: [always]
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Remove demo ConfigMaps
      ansible.builtin.command:
        cmd: "oc -n {{ aap_namespace }} delete configmap {{ item }} --ignore-not-found"
      loop:
        - demo-chain-script
        - demo-crossorg-script
      changed_when: false
