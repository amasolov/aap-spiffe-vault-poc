---
# AAP SPIFFE/Vault POC - Full Deployment
#
# Deploys SPIRE, Vault, and wires SPIFFE JWT auth on an OCP cluster
# that already has AAP 2.7 running.
#
# Prerequisites:
#   - OCP cluster with AAP 2.7 deployed (namespace: aap)
#   - oc CLI authenticated to the cluster
#   - helm CLI available
#
# Usage:
#   ansible-playbook deploy-poc.yml                           # full deploy
#   ansible-playbook deploy-poc.yml --tags spire              # SPIRE only
#   ansible-playbook deploy-poc.yml --tags vault              # Vault only
#   ansible-playbook deploy-poc.yml --tags integrate          # wire SPIFFE+Vault
#   ansible-playbook deploy-poc.yml --tags aap                # configure AAP
#
# Variables (override with -e):
#   kubeconfig:    path to kubeconfig (default: KUBECONFIG env or ~/.kube/config)
#   aap_namespace: AAP namespace (default: aap)

# ============================================================
# Phase 1: Deploy SPIRE (server + agent + OIDC discovery)
# ============================================================
- name: "Deploy SPIRE"
  hosts: localhost
  gather_facts: false
  connection: local
  tags: [spire]
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Create SPIRE namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ spire_namespace }}"

    # --- SPIRE Server ---
    - name: Deploy SPIRE Server ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: spire-server-config
            namespace: "{{ spire_namespace }}"
          data:
            server.conf: |
              server {
                bind_address = "0.0.0.0"
                bind_port = "8081"
                socket_path = "/run/spire/data/api.sock"
                trust_domain = "{{ spire_trust_domain }}"
                data_dir = "/run/spire/data"
                log_level = "INFO"
                ca_ttl = "24h"
                default_x509_svid_ttl = "1h"
                default_jwt_svid_ttl = "5m"

                ca_subject {
                  country = ["AU"]
                  organization = ["AAP SPIFFE POC"]
                  common_name = ""
                }

                jwt_issuer = "https://oidc-discovery-{{ spire_namespace }}.{{ cluster_domain }}"
              }

              plugins {
                DataStore "sql" {
                  plugin_data {
                    database_type = "sqlite3"
                    connection_string = "/run/spire/data/datastore.sqlite3"
                  }
                }

                NodeAttestor "k8s_psat" {
                  plugin_data {
                    clusters = {
                      "hosted-1" = {
                        service_account_allow_list = ["{{ spire_namespace }}:spire-agent"]
                      }
                    }
                  }
                }

                KeyManager "disk" {
                  plugin_data {
                    keys_path = "/run/spire/data/keys.json"
                  }
                }
              }

    - name: Deploy SPIRE Server ServiceAccount
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: spire-server
            namespace: "{{ spire_namespace }}"

    - name: Deploy SPIRE Server ClusterRole
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: spire-server
          rules:
            - apiGroups: [""]
              resources: ["pods", "nodes"]
              verbs: ["get", "list", "watch"]
            - apiGroups: ["authentication.k8s.io"]
              resources: ["tokenreviews"]
              verbs: ["create"]

    - name: Deploy SPIRE Server ClusterRoleBinding
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: spire-server
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: spire-server
          subjects:
            - kind: ServiceAccount
              name: spire-server
              namespace: "{{ spire_namespace }}"

    - name: Grant SPIRE Agent privileged SCC
      ansible.builtin.command:
        cmd: "oc adm policy add-scc-to-user privileged -z spire-agent -n {{ spire_namespace }}"
      changed_when: true
      failed_when: false

    - name: Grant SPIRE Server anyuid SCC
      ansible.builtin.command:
        cmd: "oc adm policy add-scc-to-user anyuid -z spire-server -n {{ spire_namespace }}"
      changed_when: true
      failed_when: false

    - name: Deploy SPIRE Server StatefulSet
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: spire-server
            namespace: "{{ spire_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: spire-server
            serviceName: spire-server
            template:
              metadata:
                labels:
                  app: spire-server
              spec:
                serviceAccountName: spire-server
                securityContext:
                  runAsUser: 0
                  fsGroup: 0
                containers:
                  - name: spire-server
                    image: "{{ spire_server_image }}"
                    args: ["-config", "/run/spire/config/server.conf"]
                    ports:
                      - containerPort: 8081
                        name: grpc
                    volumeMounts:
                      - name: config
                        mountPath: /run/spire/config
                        readOnly: true
                      - name: data
                        mountPath: /run/spire/data
                    livenessProbe:
                      exec:
                        command:
                          - /opt/spire/bin/spire-server
                          - healthcheck
                          - -socketPath
                          - /run/spire/data/api.sock
                      initialDelaySeconds: 15
                      periodSeconds: 30
                    readinessProbe:
                      exec:
                        command:
                          - /opt/spire/bin/spire-server
                          - healthcheck
                          - -socketPath
                          - /run/spire/data/api.sock
                      initialDelaySeconds: 10
                      periodSeconds: 10
                  - name: oidc-discovery-provider
                    image: "{{ spire_oidc_image }}"
                    args:
                      - "-config"
                      - "/run/spire/oidc-config/oidc-discovery-provider.conf"
                    ports:
                      - containerPort: 8080
                        name: http
                      - containerPort: 8008
                        name: health
                    volumeMounts:
                      - name: oidc-config
                        mountPath: /run/spire/oidc-config
                        readOnly: true
                      - name: data
                        mountPath: /run/spire/data
                    readinessProbe:
                      httpGet:
                        path: /ready
                        port: 8008
                      initialDelaySeconds: 10
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: /live
                        port: 8008
                      initialDelaySeconds: 15
                      periodSeconds: 30
                volumes:
                  - name: config
                    configMap:
                      name: spire-server-config
                  - name: oidc-config
                    configMap:
                      name: oidc-discovery-provider-config
            volumeClaimTemplates:
              - metadata:
                  name: data
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 1Gi

    - name: Deploy SPIRE Server Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: spire-server
            namespace: "{{ spire_namespace }}"
          spec:
            selector:
              app: spire-server
            ports:
              - port: 8081
                targetPort: 8081
                name: grpc

    # --- SPIRE Agent ---
    - name: Deploy SPIRE Agent ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: spire-agent-config
            namespace: "{{ spire_namespace }}"
          data:
            agent.conf: |
              agent {
                data_dir = "/run/spire"
                log_level = "INFO"
                server_address = "spire-server.{{ spire_namespace }}.svc.cluster.local"
                server_port = "8081"
                socket_path = "/run/spire/sockets/agent.sock"
                trust_domain = "{{ spire_trust_domain }}"
                insecure_bootstrap = true
              }

              plugins {
                NodeAttestor "k8s_psat" {
                  plugin_data {
                    cluster = "hosted-1"
                  }
                }

                KeyManager "memory" {
                  plugin_data {}
                }

                WorkloadAttestor "k8s" {
                  plugin_data {
                    skip_kubelet_verification = true
                  }
                }
              }

    - name: Deploy SPIRE Agent ServiceAccount
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: spire-agent
            namespace: "{{ spire_namespace }}"

    - name: Deploy SPIRE Agent ClusterRole
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: spire-agent
          rules:
            - apiGroups: [""]
              resources: ["pods", "nodes", "nodes/proxy"]
              verbs: ["get", "list"]

    - name: Deploy SPIRE Agent ClusterRoleBinding
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: spire-agent
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: spire-agent
          subjects:
            - kind: ServiceAccount
              name: spire-agent
              namespace: "{{ spire_namespace }}"

    - name: Deploy SPIRE Agent DaemonSet
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: DaemonSet
          metadata:
            name: spire-agent
            namespace: "{{ spire_namespace }}"
          spec:
            selector:
              matchLabels:
                app: spire-agent
            template:
              metadata:
                labels:
                  app: spire-agent
              spec:
                serviceAccountName: spire-agent
                hostPID: true
                hostNetwork: true
                dnsPolicy: ClusterFirstWithHostNet
                containers:
                  - name: spire-agent
                    image: "{{ spire_agent_image }}"
                    args: ["-config", "/run/spire/config/agent.conf"]
                    securityContext:
                      privileged: true
                    volumeMounts:
                      - name: config
                        mountPath: /run/spire/config
                        readOnly: true
                      - name: spire-agent-socket
                        mountPath: /run/spire/sockets
                      - name: spire-token
                        mountPath: /var/run/secrets/tokens
                    livenessProbe:
                      exec:
                        command:
                          - /opt/spire/bin/spire-agent
                          - healthcheck
                          - -socketPath
                          - /run/spire/sockets/agent.sock
                      initialDelaySeconds: 15
                      periodSeconds: 30
                    readinessProbe:
                      exec:
                        command:
                          - /opt/spire/bin/spire-agent
                          - healthcheck
                          - -socketPath
                          - /run/spire/sockets/agent.sock
                      initialDelaySeconds: 10
                      periodSeconds: 10
                volumes:
                  - name: config
                    configMap:
                      name: spire-agent-config
                  - name: spire-agent-socket
                    hostPath:
                      path: /run/spire/sockets
                      type: DirectoryOrCreate
                  - name: spire-token
                    projected:
                      sources:
                        - serviceAccountToken:
                            path: spire-agent
                            expirationSeconds: 7200
                            audience: spire-server

    # --- OIDC Discovery Provider ---
    - name: Deploy OIDC Discovery Provider ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: oidc-discovery-provider-config
            namespace: "{{ spire_namespace }}"
          data:
            oidc-discovery-provider.conf: |
              log_level = "INFO"
              domains = ["oidc-discovery-{{ spire_namespace }}.{{ cluster_domain }}", "oidc-discovery.{{ spire_namespace }}.svc.cluster.local"]
              allow_insecure_scheme = true
              insecure_addr = ":8080"

              server_api {
                address = "unix:///run/spire/data/api.sock"
              }

              health_checks {
                bind_port = "8008"
                ready_path = "/ready"
                live_path = "/live"
              }

    - name: Deploy OIDC Discovery Provider Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: oidc-discovery
            namespace: "{{ spire_namespace }}"
          spec:
            selector:
              app: spire-server
            ports:
              - port: 80
                targetPort: 8080
                name: http

    - name: Deploy OIDC Discovery Provider Route
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: oidc-discovery
            namespace: "{{ spire_namespace }}"
          spec:
            host: "oidc-discovery-{{ spire_namespace }}.{{ cluster_domain }}"
            to:
              kind: Service
              name: oidc-discovery
            port:
              targetPort: http
            tls:
              termination: edge
              insecureEdgeTerminationPolicy: Redirect

    - name: Wait for SPIRE Server to be ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        name: spire-server
        namespace: "{{ spire_namespace }}"
      register: __spire_server
      retries: 30
      delay: 10
      until: >-
        __spire_server.resources | length > 0 and
        (__spire_server.resources[0].status.readyReplicas | default(0)) >= 1

    - name: Wait for SPIRE Agent to be ready
      ansible.builtin.shell:
        cmd: >-
          oc -n {{ spire_namespace }} get ds spire-agent
          -o jsonpath='{.status.numberReady}' 2>/dev/null || echo 0
        executable: /bin/bash
      register: __agent_ready
      changed_when: false
      retries: 30
      delay: 10
      until: __agent_ready.stdout | int > 0

    - name: Get SPIRE Server pod name
      ansible.builtin.command:
        cmd: "oc -n {{ spire_namespace }} get pods -l app=spire-server --no-headers -o custom-columns=NAME:.metadata.name"
      register: __spire_server_pod
      changed_when: false

    # --- Register workload entries for AAP ---
    - name: Get active SPIRE agent SPIFFE IDs
      ansible.builtin.shell:
        cmd: |
          oc exec -n {{ spire_namespace }} {{ __spire_server_pod.stdout_lines[0] }} -c spire-server -- \
            /opt/spire/bin/spire-server agent list -socketPath /run/spire/data/api.sock -output json 2>/dev/null | \
            python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          agents = sorted(data.get('agents', []), key=lambda a: a.get('x509svid_expires_at', '0'), reverse=True)
          for a in agents[:3]:
              td = a['id']['trust_domain']
              path = a['id']['path']
              print(f'spiffe://{td}{path}')
          "
        executable: /bin/bash
      register: __active_agents
      changed_when: false

    - name: Delete stale SPIRE entries
      ansible.builtin.shell:
        cmd: |
          oc exec -n {{ spire_namespace }} {{ __spire_server_pod.stdout_lines[0] }} -c spire-server -- \
            /opt/spire/bin/spire-server entry show -socketPath /run/spire/data/api.sock -output json 2>/dev/null | \
            python3 -c "
          import json,sys
          data = json.load(sys.stdin)
          for e in data.get('entries', []):
              print(e['id'])
          "
        executable: /bin/bash
      register: __old_entries
      changed_when: false

    - name: Remove stale entries
      ansible.builtin.command:
        cmd: >-
          oc exec -n {{ spire_namespace }} {{ __spire_server_pod.stdout_lines[0] }} -c spire-server --
          /opt/spire/bin/spire-server entry delete
          -socketPath /run/spire/data/api.sock
          -entryID {{ item }}
      loop: "{{ __old_entries.stdout_lines }}"
      changed_when: true
      failed_when: false

    - name: Register AAP SPIFFE IDs (per agent)
      ansible.builtin.command:
        cmd: >-
          oc exec -n {{ spire_namespace }} {{ __spire_server_pod.stdout_lines[0] }} -c spire-server --
          /opt/spire/bin/spire-server entry create
          -socketPath /run/spire/data/api.sock
          -spiffeID {{ item.0.value.spiffe_id }}
          -parentID {{ item.1 }}
          -selector k8s:ns:{{ aap_namespace }}
          -dns {{ item.0.key }}.{{ aap_namespace }}.svc.cluster.local
      loop: "{{ aap_spiffe_ids | dict2items | product(__active_agents.stdout_lines) }}"
      register: __entry_create
      changed_when: "'Entry ID' in __entry_create.stdout"
      failed_when: false

    - name: SPIRE deployment complete
      ansible.builtin.debug:
        msg: >-
          SPIRE deployed in {{ spire_namespace }}.
          OIDC Discovery: https://oidc-discovery-{{ spire_namespace }}.{{ cluster_domain }}
          Registered {{ aap_spiffe_ids | length }} SPIFFE IDs for AAP.

# ============================================================
# Phase 2: Deploy Vault (dev mode for POC)
# ============================================================
- name: "Deploy Vault"
  hosts: localhost
  gather_facts: false
  connection: local
  tags: [vault]
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Create Vault namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ vault_namespace }}"

    - name: Deploy Vault config
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: vault-config
            namespace: "{{ vault_namespace }}"
          data:
            vault.hcl: |
              storage "file" {
                path = "/vault/data"
              }
              listener "tcp" {
                address     = "0.0.0.0:8200"
                tls_disable = 1
              }
              api_addr     = "http://0.0.0.0:8200"
              cluster_addr = "http://0.0.0.0:8201"
              ui           = true
              disable_mlock = true

    - name: Deploy Vault StatefulSet
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: vault
            namespace: "{{ vault_namespace }}"
          spec:
            replicas: 1
            serviceName: vault
            selector:
              matchLabels:
                app: vault
            template:
              metadata:
                labels:
                  app: vault
              spec:
                containers:
                  - name: vault
                    image: "{{ vault_image }}"
                    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
                    ports:
                      - containerPort: 8200
                        name: http
                      - containerPort: 8201
                        name: cluster
                    env:
                      - name: VAULT_ADDR
                        value: "http://127.0.0.1:8200"
                      - name: SKIP_SETCAP
                        value: "true"
                      - name: HOME
                        value: "/tmp"
                    volumeMounts:
                      - name: data
                        mountPath: /vault/data
                      - name: config
                        mountPath: /vault/config
                        readOnly: true
                    readinessProbe:
                      httpGet:
                        path: /v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200
                        port: 8200
                      initialDelaySeconds: 5
                      periodSeconds: 10
                    livenessProbe:
                      httpGet:
                        path: /v1/sys/health?standbyok=true&uninitcode=200&sealedcode=200
                        port: 8200
                      initialDelaySeconds: 15
                      periodSeconds: 30
                volumes:
                  - name: config
                    configMap:
                      name: vault-config
            volumeClaimTemplates:
              - metadata:
                  name: data
                spec:
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 1Gi

    - name: Deploy Vault Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: vault
            namespace: "{{ vault_namespace }}"
          spec:
            selector:
              app: vault
            ports:
              - port: 8200
                targetPort: 8200
                name: http

    - name: Deploy Vault Route
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: vault
            namespace: "{{ vault_namespace }}"
          spec:
            host: "{{ vault_route }}"
            to:
              kind: Service
              name: vault
            port:
              targetPort: http
            tls:
              termination: edge
              insecureEdgeTerminationPolicy: Redirect

    - name: Wait for Vault pod to be running
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: StatefulSet
        name: vault
        namespace: "{{ vault_namespace }}"
      register: __vault_sts
      retries: 30
      delay: 10
      until: >-
        __vault_sts.resources | length > 0 and
        (__vault_sts.resources[0].status.readyReplicas | default(0)) >= 1

    - name: Get Vault pod name
      ansible.builtin.command:
        cmd: "oc -n {{ vault_namespace }} get pods -l app=vault --no-headers -o custom-columns=NAME:.metadata.name"
      register: __vault_pod
      changed_when: false

    # --- Initialize Vault if needed ---
    - name: Check Vault init status
      ansible.builtin.shell:
        cmd: |
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} -- \
            sh -c 'VAULT_ADDR=http://127.0.0.1:8200 vault status -format=json 2>/dev/null || echo "{\"initialized\":false,\"sealed\":true}"'
        executable: /bin/bash
      register: __vault_status_raw
      changed_when: false
      failed_when: false

    - name: Parse Vault status
      ansible.builtin.set_fact:
        __vault_status: "{{ __vault_status_raw.stdout_lines | last | from_json }}"

    - name: Set Vault state facts
      ansible.builtin.set_fact:
        __vault_initialized: "{{ __vault_status.get('initialized', false) }}"
        __vault_sealed: "{{ __vault_status.get('sealed', true) }}"

    - name: Initialize Vault (first time only)
      ansible.builtin.shell:
        cmd: >-
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} --
          vault operator init -key-shares=1 -key-threshold=1 -format=json
        executable: /bin/bash
      register: __vault_init
      when: not (__vault_initialized | bool)
      changed_when: true

    - name: Store Vault credentials in Secret (for auto-unseal on restart)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: vault-init-credentials
            namespace: "{{ vault_namespace }}"
          type: Opaque
          stringData:
            unseal_key: "{{ (__vault_init.stdout | from_json).unseal_keys_b64[0] }}"
            root_token: "{{ (__vault_init.stdout | from_json).root_token }}"
      when: __vault_init is changed

    - name: Read Vault credentials from Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: vault-init-credentials
        namespace: "{{ vault_namespace }}"
      register: __vault_creds

    - name: Set Vault credential facts
      ansible.builtin.set_fact:
        vault_unseal_key: "{{ __vault_creds.resources[0].data.unseal_key | b64decode }}"
        vault_root_token: "{{ __vault_creds.resources[0].data.root_token | b64decode }}"

    - name: Unseal Vault (if sealed)
      ansible.builtin.shell:
        cmd: >-
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} --
          vault operator unseal {{ vault_unseal_key }}
        executable: /bin/bash
      when: __vault_sealed | bool
      changed_when: true

    - name: Wait for Vault to be unsealed and ready
      ansible.builtin.shell:
        cmd: >-
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} --
          vault status -format=json
        executable: /bin/bash
      register: __vault_ready
      retries: 10
      delay: 5
      until: >-
        (__vault_ready.stdout | from_json).get('sealed', true) == false
      changed_when: false

    - name: Deploy Vault auto-unseal CronJob
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: vault-auto-unseal
            namespace: "{{ vault_namespace }}"
          spec:
            schedule: "* * * * *"
            concurrencyPolicy: Forbid
            successfulJobsHistoryLimit: 1
            failedJobsHistoryLimit: 1
            jobTemplate:
              spec:
                template:
                  spec:
                    serviceAccountName: default
                    restartPolicy: OnFailure
                    containers:
                      - name: unseal
                        image: "{{ vault_image }}"
                        command:
                          - sh
                          - -c
                          - |
                            export VAULT_ADDR=http://vault.{{ vault_namespace }}.svc.cluster.local:8200
                            STATUS=$(vault status -format=json 2>/dev/null) || true
                            if echo "$STATUS" | grep -q '"sealed": true'; then
                              echo "Vault is sealed, unsealing..."
                              vault operator unseal "$UNSEAL_KEY"
                            else
                              echo "Vault is already unsealed"
                            fi
                        env:
                          - name: UNSEAL_KEY
                            valueFrom:
                              secretKeyRef:
                                name: vault-init-credentials
                                key: unseal_key
                          - name: HOME
                            value: "/tmp"

    # --- Seed demo secrets (idempotent) ---
    - name: Check if KV v2 already enabled
      ansible.builtin.shell:
        cmd: >-
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} --
          env VAULT_TOKEN={{ vault_root_token }}
          vault secrets list -format=json
        executable: /bin/bash
      register: __secrets_list
      changed_when: false
      failed_when: false

    - name: Enable KV v2 secrets engine
      ansible.builtin.shell:
        cmd: >-
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} --
          env VAULT_TOKEN={{ vault_root_token }}
          vault secrets enable -version=2 -path=secret kv
        executable: /bin/bash
      register: __kv_enable
      changed_when: "'Success' in __kv_enable.stdout"
      failed_when: false

    - name: Seed platform secrets
      ansible.builtin.shell:
        cmd: >-
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} --
          env VAULT_TOKEN={{ vault_root_token }}
          vault kv put secret/hub/aap/config
          admin_token=spiffe-rotated-token-$(date +%s)
          db_password=aap-db-secret-from-vault
        executable: /bin/bash
      changed_when: true

    - name: Seed org-scoped secrets
      ansible.builtin.shell:
        cmd: >-
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} --
          env VAULT_TOKEN={{ vault_root_token }}
          vault kv put secret/aap/org/{{ item.org }}/credentials
          ssh_key="org-{{ item.org }}-ssh-private-key"
          api_token="org-{{ item.org }}-cloud-api-token-$(date +%s)"
          cloud_password="org-{{ item.org }}-cloud-password"
        executable: /bin/bash
      loop:
        - { org: infra-corp }
        - { org: appdev-squad }
        - { org: secops-team }
        - { org: platform-ops }
      changed_when: true

    - name: Seed EDA webhook secret
      ansible.builtin.shell:
        cmd: >-
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} --
          env VAULT_TOKEN={{ vault_root_token }}
          vault kv put secret/aap/eda/webhook-credentials
          pagerduty_api_key="eda-pagerduty-key-rotated-$(date +%s)"
          aws_access_key="eda-aws-access-key"
          aws_secret_key="eda-aws-secret-rotated-$(date +%s)"
        executable: /bin/bash
      changed_when: true

    - name: Vault deployment complete
      ansible.builtin.debug:
        msg: >-
          Vault deployed at https://{{ vault_route }} (persistent storage).
          Root token stored in Secret vault-init-credentials.
          Auto-unseal CronJob active. Seeded secrets for platform, 4 orgs, and EDA.

# ============================================================
# Phase 3: Wire SPIFFE JWT auth in Vault
# ============================================================
- name: "Integrate SPIFFE + Vault"
  hosts: localhost
  gather_facts: false
  connection: local
  tags: [integrate]
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Get Vault pod name
      ansible.builtin.command:
        cmd: "oc -n {{ vault_namespace }} get pods -l app=vault --no-headers -o custom-columns=NAME:.metadata.name"
      register: __vault_pod
      changed_when: false

    - name: Read Vault credentials from Secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: vault-init-credentials
        namespace: "{{ vault_namespace }}"
      register: __vault_creds

    - name: Set Vault root token fact
      ansible.builtin.set_fact:
        vault_root_token: "{{ __vault_creds.resources[0].data.root_token | b64decode }}"

    - name: Enable JWT auth method
      ansible.builtin.shell:
        cmd: >-
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} --
          env VAULT_TOKEN={{ vault_root_token }}
          vault auth enable jwt
        executable: /bin/bash
      register: __jwt_enable
      changed_when: "'Success' in __jwt_enable.stdout"
      failed_when: false

    - name: Configure JWT auth with SPIRE OIDC discovery (internal URL)
      ansible.builtin.shell:
        cmd: >-
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} --
          env VAULT_TOKEN={{ vault_root_token }}
          vault write auth/jwt/config
          oidc_discovery_url=http://oidc-discovery.{{ spire_namespace }}.svc.cluster.local
          default_role=aap-platform
        executable: /bin/bash
      register: __jwt_config
      changed_when: "'Success' in __jwt_config.stdout"
      retries: 5
      delay: 10

    # --- Create Vault policies (one per SPIFFE identity) ---
    - name: Create Vault policies for each SPIFFE identity
      ansible.builtin.shell:
        cmd: |
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} -- \
            sh -c 'export VAULT_TOKEN={{ vault_root_token }}; cat <<POLICY | vault policy write {{ item.value.vault_policy }} -
          {% for path in item.value.vault_paths %}
          path "{{ path }}" {
            capabilities = ["read"]
          }
          {% endfor %}
          POLICY'
        executable: /bin/bash
      loop: "{{ aap_spiffe_ids | dict2items }}"
      changed_when: true

    # --- Create JWT roles (one per SPIFFE identity) ---
    - name: Create Vault JWT roles for each SPIFFE identity
      ansible.builtin.shell:
        cmd: >-
          oc exec -n {{ vault_namespace }} {{ __vault_pod.stdout_lines[0] }} --
          env VAULT_TOKEN={{ vault_root_token }}
          vault write auth/jwt/role/{{ item.value.vault_role }}
          role_type=jwt
          user_claim=sub
          bound_audiences={{ vault_jwt_audience }}
          bound_subject=''
          token_ttl=3600
          token_policies={{ item.value.vault_policy }}
        executable: /bin/bash
      loop: "{{ aap_spiffe_ids | dict2items }}"
      changed_when: true

    - name: Integration complete
      ansible.builtin.debug:
        msg: >-
          SPIFFE JWT auth configured in Vault.
          Created {{ aap_spiffe_ids | length }} policies and roles.
          OIDC discovery: https://oidc-discovery-{{ spire_namespace }}.{{ cluster_domain }}

# ============================================================
# Phase 4: Deploy Kyverno + sidecar injection for AAP
# ============================================================
- name: "Deploy Kyverno"
  hosts: localhost
  gather_facts: false
  connection: local
  tags: [kyverno, aap]
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Create Kyverno namespace
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ kyverno_namespace }}"
            labels:
              pod-security.kubernetes.io/enforce: privileged

    - name: Install Kyverno via Helm (no wait, SAs must exist for SCC grants)
      ansible.builtin.shell:
        cmd: |
          helm repo add kyverno https://kyverno.github.io/kyverno/ 2>/dev/null || true
          helm repo update kyverno
          helm upgrade --install kyverno kyverno/kyverno \
            --namespace {{ kyverno_namespace }} \
            --set admissionController.replicas=1 \
            --set backgroundController.replicas=1 \
            --set cleanupController.replicas=1 \
            --set reportsController.replicas=1 \
            --no-hooks \
            --timeout 5m
        executable: /bin/bash
      register: __helm_kyverno
      changed_when: "'has been upgraded' in __helm_kyverno.stdout or 'has been installed' in __helm_kyverno.stdout"

    - name: Grant privileged SCC to Kyverno service accounts
      ansible.builtin.command:
        cmd: "oc adm policy add-scc-to-user privileged -z {{ item }} -n {{ kyverno_namespace }}"
      loop:
        - kyverno-admission-controller
        - kyverno-background-controller
        - kyverno-cleanup-controller
        - kyverno-reports-controller
      changed_when: true

    - name: Restart Kyverno deployments to pick up SCC grants
      ansible.builtin.command:
        cmd: "oc rollout restart deployment/{{ item }} -n {{ kyverno_namespace }}"
      loop:
        - kyverno-admission-controller
        - kyverno-background-controller
        - kyverno-cleanup-controller
        - kyverno-reports-controller
      changed_when: true

    - name: Wait for Kyverno admission controller
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: kyverno-admission-controller
        namespace: "{{ kyverno_namespace }}"
      register: __kyverno_deploy
      retries: 30
      delay: 10
      until: >-
        __kyverno_deploy.resources | length > 0 and
        (__kyverno_deploy.resources[0].status.readyReplicas | default(0)) >= 1

    - name: Kyverno deployed
      ansible.builtin.debug:
        msg: "Kyverno deployed in {{ kyverno_namespace }}"

- name: "Configure AAP SPIFFE sidecar injection"
  hosts: localhost
  gather_facts: false
  connection: local
  tags: [aap]
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Deploy spiffe-vault-client ConfigMap
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: spiffe-vault-client
            namespace: "{{ aap_namespace }}"
          data:
            spiffe-vault-client.py: "{{ lookup('file', 'scripts/spiffe-vault-client.py') }}"

    - name: Deploy spiffe-helper config
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: spiffe-helper-config
            namespace: "{{ aap_namespace }}"
          data:
            helper.conf: |
              agent_address = "/run/spire/sockets/agent.sock"
              cmd = ""
              cert_dir = "/svids"
              svid_file_name = "svid.pem"
              svid_key_file_name = "svid_key.pem"
              svid_bundle_file_name = "svid_bundle.pem"

              jwt_svids = [
                {
                  jwt_audience = "{{ vault_jwt_audience }}"
                  jwt_svid_file_name = "jwt.token"
                }
              ]

    - name: Remove old CronJob (replaced by Kyverno sidecar injection)
      kubernetes.core.k8s:
        state: absent
        api_version: batch/v1
        kind: CronJob
        name: spiffe-vault-credential-sync
        namespace: "{{ aap_namespace }}"
      failed_when: false

    - name: Label AAP namespace for privileged pod security
      ansible.builtin.command:
        cmd: "oc label namespace {{ aap_namespace }} pod-security.kubernetes.io/enforce=privileged --overwrite"
      changed_when: true
      failed_when: false

    - name: Grant AAP service accounts privileged SCC (for hostPath SPIRE socket + seccomp)
      ansible.builtin.command:
        cmd: "oc adm policy add-scc-to-user privileged -z {{ item }} -n {{ aap_namespace }}"
      loop:
        - aap-controller
        - aap-eda
        - aap-gateway
      changed_when: true
      failed_when: false

    - name: Deploy Kyverno ClusterPolicy for AAP sidecar injection
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: kyverno.io/v1
          kind: ClusterPolicy
          metadata:
            name: inject-spiffe-vault-sidecars
            annotations:
              policies.kyverno.io/title: Inject SPIFFE/Vault sidecars into AAP pods
              policies.kyverno.io/description: >-
                Mutates AAP pods to inject spiffe-helper and spiffe-vault-client
                sidecars for zero-trust credential management via SPIFFE JWT.
          spec:
            rules:
              - name: inject-spiffe-sidecars
                match:
                  any:
                    - resources:
                        kinds:
                          - Pod
                        namespaces:
                          - "{{ aap_namespace }}"
                        selector:
                          matchExpressions:
                            - key: app.kubernetes.io/managed-by
                              operator: In
                              values:
                                - automationcontroller-operator
                                - eda-operator
                                - aap-operator
                preconditions:
                  all:
                    - key: "{{ '{{' }}request.object.metadata.labels.\"app.kubernetes.io/name\"{{ '}}' }}"
                      operator: AnyIn
                      value:
                        - aap-controller-task
                        - aap-controller-web
                        - aap-eda
                        - aap
                    - key: "{{ '{{' }}request.object.metadata.annotations.\"spiffe-injected\"  || '' {{ '}}' }}"
                      operator: NotEquals
                      value: "true"
                mutate:
                  patchesJson6902: |-
                    - op: add
                      path: /metadata/annotations/spiffe-injected
                      value: "true"
                    - op: add
                      path: /spec/initContainers/-
                      value:
                        name: init-spiffe-helper
                        image: {{ spire_helper_image }}
                        args:
                          - "-config"
                          - "/run/spire/config/helper.conf"
                          - "-daemon-mode=false"
                        securityContext:
                          privileged: true
                          seLinuxOptions:
                            type: spc_t
                        volumeMounts:
                          - name: spire-agent-socket
                            mountPath: /run/spire/sockets
                          - name: svids
                            mountPath: /svids
                          - name: spiffe-helper-config
                            mountPath: /run/spire/config
                            readOnly: true
                    - op: add
                      path: /spec/initContainers/-
                      value:
                        name: init-spiffe-vault-client
                        image: registry.access.redhat.com/ubi9/python-311:latest
                        command: ["python3", "/opt/app-root/src/spiffe-vault-client.py", "--init"]
                        securityContext:
                          privileged: true
                          seLinuxOptions:
                            type: spc_t
                        env:
                          - name: VAULT_URL
                            value: "http://vault.{{ vault_namespace }}.svc.cluster.local:8200"
                          - name: VAULT_ROLE
                            value: aap-platform
                          - name: VAULT_CREDENTIAL_PATH
                            value: secret/data/hub/aap/config
                          - name: JWT_TOKEN_FILE
                            value: /svids/jwt.token
                          - name: CREDENTIALS_FILE
                            value: /run/secrets/vault-credentials/credentials.properties
                        volumeMounts:
                          - name: svids
                            mountPath: /svids
                            readOnly: true
                          - name: vault-credentials
                            mountPath: /run/secrets/vault-credentials
                          - name: spiffe-vault-client
                            mountPath: /opt/app-root/src
                            readOnly: true
                    - op: add
                      path: /spec/containers/-
                      value:
                        name: spiffe-helper
                        image: {{ spire_helper_image }}
                        args:
                          - "-config"
                          - "/run/spire/config/helper.conf"
                        securityContext:
                          privileged: true
                          seLinuxOptions:
                            type: spc_t
                        volumeMounts:
                          - name: spire-agent-socket
                            mountPath: /run/spire/sockets
                          - name: svids
                            mountPath: /svids
                          - name: spiffe-helper-config
                            mountPath: /run/spire/config
                            readOnly: true
                    - op: add
                      path: /spec/containers/-
                      value:
                        name: spiffe-vault-client
                        image: registry.access.redhat.com/ubi9/python-311:latest
                        command: ["python3", "/opt/app-root/src/spiffe-vault-client.py"]
                        securityContext:
                          privileged: true
                          seLinuxOptions:
                            type: spc_t
                        env:
                          - name: VAULT_URL
                            value: "http://vault.{{ vault_namespace }}.svc.cluster.local:8200"
                          - name: VAULT_ROLE
                            value: aap-platform
                          - name: VAULT_CREDENTIAL_PATH
                            value: secret/data/hub/aap/config
                          - name: JWT_TOKEN_FILE
                            value: /svids/jwt.token
                          - name: CREDENTIALS_FILE
                            value: /run/secrets/vault-credentials/credentials.properties
                        volumeMounts:
                          - name: svids
                            mountPath: /svids
                            readOnly: true
                          - name: vault-credentials
                            mountPath: /run/secrets/vault-credentials
                          - name: spiffe-vault-client
                            mountPath: /opt/app-root/src
                            readOnly: true
                    - op: add
                      path: /spec/volumes/-
                      value:
                        name: spire-agent-socket
                        hostPath:
                          path: /run/spire/sockets
                          type: Directory
                    - op: add
                      path: /spec/volumes/-
                      value:
                        name: svids
                        emptyDir: {}
                    - op: add
                      path: /spec/volumes/-
                      value:
                        name: vault-credentials
                        emptyDir: {}
                    - op: add
                      path: /spec/volumes/-
                      value:
                        name: spiffe-helper-config
                        configMap:
                          name: spiffe-helper-config
                    - op: add
                      path: /spec/volumes/-
                      value:
                        name: spiffe-vault-client
                        configMap:
                          name: spiffe-vault-client

    - name: AAP integration complete
      ansible.builtin.debug:
        msg: >-
          Kyverno ClusterPolicy deployed. AAP pods matching controller/EDA/gateway
          will automatically get spiffe-helper and spiffe-vault-client sidecars
          injected. Credentials are continuously renewed inside each pod.
